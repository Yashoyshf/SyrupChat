<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyrupChat</title>
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #ca8a04; }
  </style>
</head>
<body class="bg-black text-zinc-100 h-dvh flex flex-col overflow-hidden select-none sm:select-auto">

  <!-- Mandatory Google Login Gate -->
  <div id="login-screen" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-zinc-950 border border-zinc-800 rounded-2xl p-8 text-center shadow-2xl">
      <div class="inline-block px-3 py-1 rounded-full bg-yellow-600/20 border border-yellow-600/40 text-yellow-500 text-xs font-semibold tracking-wide mb-4">
        #GENERAL
      </div>
      <h1 class="text-2xl font-bold text-white mb-2">SyrupChat</h1>
      <p class="text-sm text-zinc-400 mb-6">Sign in with your Google Account to join the chat room.</p>

      <button id="google-login-btn"
        class="w-full flex items-center justify-center gap-3 bg-yellow-600 hover:bg-yellow-500 active:bg-yellow-700 text-black font-semibold py-3 px-4 rounded-xl transition cursor-pointer">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 1.76-1.3 3.25-2.77 4.25v3.53h4.48c2.62-2.41 4.13-5.96 4.13-10.15 0-.79-.07-1.56-.18-2.36z"/>
          <path fill="currentColor" d="M12.18 22c3.74 0 6.88-1.24 9.17-3.36l-4.48-3.53c-1.24.83-2.83 1.32-4.69 1.32-3.61 0-6.67-2.44-7.76-5.71H-.2v3.6C2.08 18.85 6.76 22 12.18 22z"/>
          <path fill="currentColor" d="M4.42 10.72c-.28-.83-.44-1.72-.44-2.64s.16-1.81.44-2.64V1.84H-.2C-1.14 3.71-1.68 5.83-1.68 8.08s.54 4.37 1.48 6.24l4.62-3.6z"/>
          <path fill="currentColor" d="M12.18 3.63c2.03 0 3.86.7 5.3 2.07l3.97-3.97C19.05-.51 15.92-1.84 12.18-1.84 6.76-1.84 2.08 1.31-.2 5.84l4.62 3.6c1.09-3.27 4.15-5.81 7.76-5.81z"/>
        </svg>
        Sign in with Google
      </button>

      <p id="auth-error" class="text-xs text-red-400 mt-4 hidden"></p>
    </div>
  </div>

  <!-- Drag & Drop Image Overlay -->
  <div id="drop-overlay" class="fixed inset-0 z-40 bg-black/90 border-2 border-dashed border-yellow-500 hidden items-center justify-center pointer-events-none">
    <div class="text-center">
      <p class="text-xl font-bold text-yellow-500">Drop picture to upload</p>
      <p class="text-sm text-zinc-400 mt-1">Image will be compressed automatically</p>
    </div>
  </div>

  <!-- Fullscreen Image Lightbox -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 hidden items-center justify-center p-4 cursor-zoom-out">
    <img id="lightbox-img" src="" alt="Full preview" class="max-w-full max-h-full rounded-xl border border-zinc-800" />
  </div>

  <!-- Admin Muted Users Modal -->
  <div id="muted-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="w-full max-w-sm bg-zinc-950 border border-zinc-800 rounded-2xl p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold text-yellow-500 uppercase tracking-wider">Muted Users</h2>
        <button id="close-muted-modal" class="text-zinc-400 hover:text-white text-sm cursor-pointer">✕</button>
      </div>
      <div id="muted-list" class="space-y-2 max-h-60 overflow-y-auto text-sm text-zinc-400">
        No users are currently muted.
      </div>
    </div>
  </div>

  <!-- Main Chat UI -->
  <div id="chat-app" class="hidden flex-col h-full min-h-0 max-w-4xl w-full mx-auto border-x border-zinc-900 relative overflow-hidden">

    <!-- Header: Top-Left #General | Top-Right Profile Picture + Editable Name Box -->
    <header class="shrink-0 px-4 py-3 bg-zinc-950 border-b border-zinc-800 flex items-center justify-between gap-3">
      <!-- Top Left: #General text + online count -->
      <div class="flex items-center gap-3 shrink-0">
        <span class="text-yellow-500 font-bold text-lg tracking-tight">#General</span>
        <div class="flex items-center gap-1.5 text-xs text-zinc-400">
          <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
          <span id="online-count">1 online</span>
        </div>
        <span id="lock-badge" class="hidden px-2 py-0.5 rounded bg-red-950/80 border border-red-800 text-red-400 text-[11px] font-semibold">
          🔒 Locked
        </span>
      </div>

      <!-- Top Right: Silent Admin tools + Profile Picture Upload + Editable Display Name (max 50) + Sign out -->
      <div class="flex items-center gap-2 min-w-0">
        <div id="admin-controls" class="hidden items-center gap-1.5 shrink-0">
          <button id="toggle-lock-btn"
            class="text-xs px-2.5 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-yellow-500 border border-yellow-600/40 transition cursor-pointer">
            Lock
          </button>
          <button id="open-muted-btn"
            class="text-xs px-2.5 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition cursor-pointer">
            Muted (<span id="muted-count">0</span>)
          </button>
        </div>

        <!-- Hidden Avatar File Input -->
        <input type="file" id="avatar-input" accept="image/*" class="hidden" />

        <!-- Profile Picture Upload Button (Left of Name Text Block) -->
        <button id="avatar-upload-btn" type="button" title="Click to upload profile picture"
          class="relative group w-8 h-8 rounded-full bg-zinc-900 border border-zinc-700 hover:border-yellow-500 overflow-hidden shrink-0 flex items-center justify-center transition cursor-pointer">
          <img id="header-avatar-img" src="" alt="Avatar" class="w-full h-full object-cover hidden" />
          <span id="header-avatar-fallback" class="text-xs font-bold text-yellow-500">?</span>
          <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
            <svg class="w-3.5 h-3.5 text-yellow-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>
        </button>

        <!-- Editable Display Name Text Box (Max 50 Characters) -->
        <input id="display-name-input" type="text" maxlength="50" title="Your display name (click to edit, max 50 chars)"
          placeholder="Your name"
          class="w-36 sm:w-48 bg-zinc-900 text-yellow-500 font-medium text-sm rounded-xl px-3 py-1.5 border border-zinc-800 focus:outline-none focus:border-yellow-600 transition" />

        <button id="logout-btn"
          class="text-xs px-3 py-1.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition cursor-pointer shrink-0">
          Sign out
        </button>
      </div>
    </header>

    <!-- Messages Feed -->
    <main id="messages-container" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-4 bg-black">
      <div class="text-center text-xs text-zinc-600 py-4">Welcome to #General.</div>
    </main>

    <!-- Emoji Picker Drawer (Triggered by Emoji Button) -->
    <div id="emoji-drawer" class="shrink-0 hidden mx-3 mb-2 p-3 bg-zinc-950 border border-zinc-800 rounded-2xl shadow-2xl">
      <div class="flex items-center justify-between mb-2">
        <input id="emoji-drawer-search" type="text" placeholder="Search emoji (e.g. smile, fire, gg)..."
          class="w-full bg-zinc-900 text-zinc-100 placeholder-zinc-500 text-xs rounded-lg px-3 py-1.5 border border-zinc-800 focus:outline-none focus:border-yellow-600" />
      </div>
      <div id="emoji-grid" class="grid grid-cols-8 sm:grid-cols-10 gap-1 max-h-40 overflow-y-auto text-xl"></div>
    </div>

    <!-- Inline Autocomplete Popover (Triggered by :shortcode or @mention) -->
    <div id="autocomplete-popup" class="shrink-0 hidden mx-3 mb-2 bg-zinc-950 border border-zinc-800 rounded-xl shadow-2xl overflow-hidden max-h-48 overflow-y-auto"></div>

    <!-- Whisper / Command Status Notice -->
    <div id="command-feedback" class="shrink-0 hidden px-4 py-1.5 bg-purple-950/60 border-t border-purple-800/60 text-xs text-purple-300 flex items-center justify-between">
      <span id="command-feedback-text"></span>
      <button type="button" id="close-command-feedback" class="text-purple-400 hover:text-white ml-2 cursor-pointer">✕</button>
    </div>

    <!-- Image Attachment Preview -->
    <div id="image-preview-bar" class="shrink-0 hidden px-4 pt-3 pb-1 bg-zinc-950 border-t border-zinc-800">
      <div class="relative inline-block">
        <img id="image-preview-thumb" src="" class="h-20 rounded-xl border border-yellow-600/50 object-cover" />
        <button id="cancel-image-btn" type="button"
          class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-zinc-900 border border-zinc-700 text-zinc-200 hover:text-yellow-500 text-xs font-bold flex items-center justify-center cursor-pointer">
          ✕
        </button>
      </div>
    </div>

    <!-- Restricted / Muted Banner -->
    <div id="restricted-banner" class="shrink-0 hidden p-3.5 bg-zinc-950 border-t border-zinc-800 text-center text-xs text-red-400 font-medium">
      You have been muted by an admin.
    </div>

    <!-- Message Input Form -->
    <form id="message-form" class="shrink-0 p-3 bg-zinc-950 border-t border-zinc-800 flex items-center gap-2">
      <input type="file" id="image-input" accept="image/*" class="hidden" />

      <button type="button" id="upload-btn" title="Upload picture"
        class="p-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-yellow-500 border border-zinc-800 transition cursor-pointer shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </button>

      <button type="button" id="emoji-toggle-btn" title="Emoji list (or type :keyword)"
        class="p-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-yellow-500 border border-zinc-800 transition cursor-pointer shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
          <line x1="9" y1="9" x2="9.01" y2="9"></line>
          <line x1="15" y1="9" x2="15.01" y2="9"></line>
        </svg>
      </button>

      <input id="message-input" type="text" autocomplete="off" placeholder="Message #General... (: emoji, @ mention, /msg @user whisper)"
        class="flex-1 min-w-0 bg-zinc-900 text-zinc-100 placeholder-zinc-500 text-sm rounded-xl px-4 py-2.5 border border-zinc-800 focus:outline-none focus:border-yellow-600" />

      <button type="submit"
        class="px-5 py-2.5 rounded-xl bg-yellow-600 hover:bg-yellow-500 active:bg-yellow-700 text-black font-semibold text-sm transition cursor-pointer shrink-0">
        Send
      </button>
    </form>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">

    import {

      collection,
      addDoc,
      deleteDoc,
      doc,
      setDoc,
      onSnapshot,
      query,
      orderBy,

      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // Configured Admin Accounts
    const ADMIN_EMAILS = [
      "11530584@stu.tshs.tp.edu.tw",
      "yashoysh@gmail.com"
    ];

    // Configured SyrupChat Firebase Project
    const firebaseConfig = {

      { emoji: "🍕", names: ["pizza", "food", "eat"] },
      { emoji: "🍔", names: ["burger", "food", "eat"] },
      { emoji: "🧋", names: ["boba", "bubble_tea", "milk_tea", "drink"] },
      { emoji: "☕", names: ["coffee", "tea", "cafe"] },
      { emoji: "🍯", names: ["honey", "syrup", "sweet"] },
      { emoji: "🥞", names: ["pancakes", "syrup", "breakfast"] },
      { emoji: "🐶", names: ["dog", "puppy", "woof"] },
      { emoji: "🐱", names: ["cat", "kitty", "meow"] },
      { emoji: "🦊", names: ["fox"] },
      { emoji: "🐸", names: ["frog", "pepe"] },
      { emoji: "👀", names: ["eyes", "look", "watching"] },
      { emoji: "✅", names: ["check", "done", "yes"] },

      { emoji: "❓", names: ["question", "what"] },
      { emoji: "❗", names: ["exclamation", "alert"] }
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    // DOM Elements
    const loginScreen = document.getElementById("login-screen");
    const chatApp = document.getElementById("chat-app");
    const googleLoginBtn = document.getElementById("google-login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const authError = document.getElementById("auth-error");
    const avatarInput = document.getElementById("avatar-input");
    const avatarUploadBtn = document.getElementById("avatar-upload-btn");
    const headerAvatarImg = document.getElementById("header-avatar-img");
    const headerAvatarFallback = document.getElementById("header-avatar-fallback");
    const displayNameInput = document.getElementById("display-name-input");
    const messagesContainer = document.getElementById("messages-container");
    const messageForm = document.getElementById("message-form");
    const restrictedBanner = document.getElementById("restricted-banner");
    const messageInput = document.getElementById("message-input");
    const imageInput = document.getElementById("image-input");
    const uploadBtn = document.getElementById("upload-btn");
    const imagePreviewBar = document.getElementById("image-preview-bar");
    const imagePreviewThumb = document.getElementById("image-preview-thumb");
    const cancelImageBtn = document.getElementById("cancel-image-btn");
    const dropOverlay = document.getElementById("drop-overlay");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const onlineCountEl = document.getElementById("online-count");
    const commandFeedback = document.getElementById("command-feedback");
    const commandFeedbackText = document.getElementById("command-feedback-text");
    const closeCommandFeedback = document.getElementById("close-command-feedback");

    // Emoji & Mention Elements
    const emojiToggleBtn = document.getElementById("emoji-toggle-btn");
    const emojiDrawer = document.getElementById("emoji-drawer");
    const emojiDrawerSearch = document.getElementById("emoji-drawer-search");
    const emojiGrid = document.getElementById("emoji-grid");
    const autocompletePopup = document.getElementById("autocomplete-popup");

    // Admin DOM Elements
    const adminControls = document.getElementById("admin-controls");
    const toggleLockBtn = document.getElementById("toggle-lock-btn");
    const lockBadge = document.getElementById("lock-badge");
    const openMutedBtn = document.getElementById("open-muted-btn");
    const mutedCountEl = document.getElementById("muted-count");
    const mutedModal = document.getElementById("muted-modal");
    const closeMutedModal = document.getElementById("close-muted-modal");
    const mutedListEl = document.getElementById("muted-list");

    let currentUser = null;
    let currentAvatarUrl = "";
    let isAdmin = false;
    let isRoomLocked = false;
    let mutedUsersMap = {};
    let pendingImageBase64 = null;
    let unsubscribers = [];
    let heartbeatInterval = null;
    let latestMessagesSnapshot = null;

    // Known users for @mentions & live avatars { uid: { name, avatar, online } }
    let knownUsers = {};
    // Autocomplete state
    let acItems = [];
    let acSelectedIndex = 0;
    let acTriggerRange = null;

    function showCommandNotice(msg) {
      commandFeedbackText.textContent = msg;
      commandFeedback.classList.remove("hidden");
      setTimeout(() => {
        commandFeedback.classList.add("hidden");
      }, 4500);
    }

    closeCommandFeedback.addEventListener("click", () => {
      commandFeedback.classList.add("hidden");
    });

    function getActiveDisplayName() {
      const val = displayNameInput.value.trim().slice(0, 50);
      if (val) return val;
      if (!currentUser) return "Guest";
      return (currentUser.displayName || currentUser.email.split("@")[0]).slice(0, 50);
    }

    function updateHeaderAvatarUI() {
      const name = getActiveDisplayName();
      headerAvatarFallback.textContent = (name[0] || "?").toUpperCase();
      if (currentAvatarUrl) {
        headerAvatarImg.src = currentAvatarUrl;
        headerAvatarImg.classList.remove("hidden");
        headerAvatarFallback.classList.add("hidden");
      } else {
        headerAvatarImg.classList.add("hidden");
        headerAvatarFallback.classList.remove("hidden");
      }
    }

    // Handle Profile Picture Upload (Center-cropped 128x128 JPEG)
    avatarUploadBtn.addEventListener("click", () => avatarInput.click());
    avatarInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith("image/") || !currentUser) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const SIZE = 128;
          canvas.width = SIZE;
          canvas.height = SIZE;
          const ctx = canvas.getContext("2d");

          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, SIZE, SIZE);

          const base64Avatar = canvas.toDataURL("image/jpeg", 0.8);
          currentAvatarUrl = base64Avatar;
          localStorage.setItem(`chat_avatar_${currentUser.uid}`, base64Avatar);
          updateHeaderAvatarUI();

          setDoc(
            doc(db, "presence", currentUser.uid),
            { name: getActiveDisplayName(), avatar: base64Avatar, lastSeen: Date.now() },
            { merge: true }
          );
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      avatarInput.value = "";
    });

    displayNameInput.addEventListener("change", () => {
      if (!currentUser) return;
      const fallback = (currentUser.displayName || currentUser.email.split("@")[0]).slice(0, 50);
      const cleanName = (displayNameInput.value.trim() || fallback).slice(0, 50);
      displayNameInput.value = cleanName;
      localStorage.setItem(`chat_name_${currentUser.uid}`, cleanName);
      updateHeaderAvatarUI();
      setDoc(
        doc(db, "presence", currentUser.uid),
        { name: cleanName, avatar: currentAvatarUrl, lastSeen: Date.now() },
        { merge: true }
      );
      if (latestMessagesSnapshot) renderAllMessages(latestMessagesSnapshot);
    });

    displayNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        displayNameInput.blur();
      }
    });

    googleLoginBtn.addEventListener("click", async () => {
      authError.classList.add("hidden");
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        authError.textContent = err.message;
        authError.classList.remove("hidden");
      }
    });

    logoutBtn.addEventListener("click", async () => {
      if (currentUser) {
        await deleteDoc(doc(db, "presence", currentUser.uid)).catch(() => {});
      }
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      unsubscribers.forEach((fn) => fn());
      unsubscribers = [];
      if (heartbeatInterval) clearInterval(heartbeatInterval);

      if (user) {
        currentUser = user;
        isAdmin = ADMIN_EMAILS.includes((user.email || "").toLowerCase());

        const googleName = (user.displayName || user.email.split("@")[0]).slice(0, 50);
        const savedName = localStorage.getItem(`chat_name_${user.uid}`);
        displayNameInput.value = (savedName || googleName).slice(0, 50);

        const savedAvatar = localStorage.getItem(`chat_avatar_${user.uid}`);
        currentAvatarUrl = savedAvatar || user.photoURL || "";
        updateHeaderAvatarUI();

        if (isAdmin) {
          adminControls.classList.remove("hidden");
          adminControls.classList.add("flex");
        } else {
          adminControls.classList.add("hidden");
          adminControls.classList.remove("flex");
        }

        loginScreen.classList.add("hidden");
        chatApp.classList.remove("hidden");
        chatApp.classList.add("flex");

        startModerationListeners();
        startChatListener();
        startPresence(user.uid);
      } else {
        currentUser = null;
        currentAvatarUrl = "";
        isAdmin = false;
        loginScreen.classList.remove("hidden");
        chatApp.classList.add("hidden");
        chatApp.classList.remove("flex");
      }
    });

    // =========================================================
    // EMOJI DRAWER & INLINE (:emoji / @mention) AUTOCOMPLETE
    // =========================================================
    function renderEmojiGrid(filter = "") {
      const q = filter.trim().toLowerCase();
      const filtered = q
        ? EMOJI_LIST.filter((item) => item.names.some((n) => n.includes(q)))
        : EMOJI_LIST;

      emojiGrid.innerHTML = "";
      if (filtered.length === 0) {
        emojiGrid.innerHTML = `<div class="col-span-full text-center text-xs text-zinc-500 py-3">No matching emojis</div>`;
        return;
      }

      filtered.forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = item.emoji;
        btn.title = `:${item.names[0]}:`;
        btn.className = "p-1.5 rounded-lg hover:bg-zinc-800 transition cursor-pointer flex items-center justify-center";
        btn.onclick = () => {
          insertAtCursor(item.emoji);
          emojiDrawer.classList.add("hidden");
        };
        emojiGrid.appendChild(btn);
      });
    }

    emojiToggleBtn.addEventListener("click", () => {
      hideAutocomplete();
      const isHidden = emojiDrawer.classList.contains("hidden");
      if (isHidden) {
        emojiDrawerSearch.value = "";
        renderEmojiGrid("");
        emojiDrawer.classList.remove("hidden");
        emojiDrawerSearch.focus();
      } else {
        emojiDrawer.classList.add("hidden");
      }
    });

    emojiDrawerSearch.addEventListener("input", (e) => {
      renderEmojiGrid(e.target.value);
    });

    function insertAtCursor(textToInsert) {
      const start = messageInput.selectionStart ?? messageInput.value.length;
      const end = messageInput.selectionEnd ?? messageInput.value.length;
      const before = messageInput.value.slice(0, start);
      const after = messageInput.value.slice(end);
      messageInput.value = before + textToInsert + after;
      const newPos = start + textToInsert.length;
      messageInput.focus();
      messageInput.setSelectionRange(newPos, newPos);
    }

    function applyAutocompleteSelection(index) {
      const chosen = acItems[index];
      if (!chosen || !acTriggerRange) return;

      const before = messageInput.value.slice(0, acTriggerRange.start);
      const after = messageInput.value.slice(acTriggerRange.end);
      messageInput.value = before + chosen.insertText + after;

      const newPos = before.length + chosen.insertText.length;
      hideAutocomplete();
      messageInput.focus();
      messageInput.setSelectionRange(newPos, newPos);
    }

    function hideAutocomplete() {
      autocompletePopup.classList.add("hidden");
      autocompletePopup.innerHTML = "";
      acItems = [];
      acSelectedIndex = 0;
      acTriggerRange = null;
    }

    function renderAutocomplete() {
      if (acItems.length === 0) {
        hideAutocomplete();
        return;
      }

      emojiDrawer.classList.add("hidden");
      autocompletePopup.innerHTML = "";
      acItems.forEach((item, idx) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = `w-full px-3.5 py-2 text-left flex items-center justify-between text-xs transition cursor-pointer ${
          idx === acSelectedIndex
            ? "bg-yellow-600/20 text-yellow-400"
            : "text-zinc-200 hover:bg-zinc-900"
        }`;
        row.innerHTML = item.html;
        row.onmousedown = (e) => {
          e.preventDefault();
          applyAutocompleteSelection(idx);
        };
        autocompletePopup.appendChild(row);
      });
      autocompletePopup.classList.remove("hidden");
    }

    messageInput.addEventListener("input", () => {
      const cursor = messageInput.selectionStart ?? messageInput.value.length;
      const textBeforeCursor = messageInput.value.slice(0, cursor);

      // 1. Check for ":keyword"
      const emojiMatch = textBeforeCursor.match(/(?:^|\s)(:[a-zA-Z0-9_+-]{2,})$/);
      if (emojiMatch) {
        const token = emojiMatch[1];
        const queryStr = token.slice(1).toLowerCase();
        const matches = EMOJI_LIST.filter((e) =>
          e.names.some((n) => n.startsWith(queryStr) || n.includes(queryStr))
        ).slice(0, 8);

        if (matches.length > 0) {
          acTriggerRange = { start: cursor - token.length, end: cursor };
          acSelectedIndex = 0;
          acItems = matches.map((m) => ({
            insertText: m.emoji,
            html: `<span class="flex items-center gap-2.5"><span class="text-base">${m.emoji}</span><span class="font-mono text-zinc-400">:${m.names[0]}:</span></span>`
          }));
          renderAutocomplete();
          return;
        }
      }

      // 2. Check for "@name" mention (works anywhere including after "/msg ")
      const mentionMatch = textBeforeCursor.match(/(?:^|\s)(@[^\s@]*)$/);
      if (mentionMatch) {
        const token = mentionMatch[1];
        const queryStr = token.slice(1).toLowerCase();

        const peopleMap = new Map();
        Object.values(knownUsers).forEach((u) => {
          if (!u.name) return;
          const existing = peopleMap.get(u.name);
          if (!existing || u.online) {
            peopleMap.set(u.name, { name: u.name, avatar: u.avatar || "", online: Boolean(u.online) });
          }
        });

        const people = Array.from(peopleMap.values())
          .filter((p) => p.name.toLowerCase().includes(queryStr))
          .sort((a, b) => Number(b.online) - Number(a.online))
          .slice(0, 8);

        if (people.length > 0) {
          acTriggerRange = { start: cursor - token.length, end: cursor };
          acSelectedIndex = 0;
          acItems = people.map((p) => {
            const avatarBadge = p.avatar
              ? `<img src="${escapeHTML(p.avatar)}" class="w-4 h-4 rounded-full object-cover" />`
              : `<span class="w-4 h-4 rounded-full bg-zinc-800 text-[10px] text-yellow-500 flex items-center justify-center font-bold">${escapeHTML((p.name[0] || "?").toUpperCase())}</span>`;
            return {
              insertText: `@${p.name} `,
              html: `
                <span class="flex items-center gap-2 font-medium truncate">
                  <span class="w-2 h-2 rounded-full shrink-0 ${p.online ? "bg-yellow-500" : "bg-zinc-600"}"></span>
                  ${avatarBadge}
                  <span class="truncate">@${escapeHTML(p.name)}</span>
                </span>
                <span class="text-[10px] text-zinc-500 shrink-0 ml-2">${p.online ? "online" : "recent"}</span>
              `
            };
          });
          renderAutocomplete();
          return;
        }
      }

      hideAutocomplete();
    });

    messageInput.addEventListener("keydown", (e) => {
      if (acItems.length > 0) {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          acSelectedIndex = (acSelectedIndex + 1) % acItems.length;
          renderAutocomplete();
          return;
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          acSelectedIndex = (acSelectedIndex - 1 + acItems.length) % acItems.length;
          renderAutocomplete();
          return;
        }
        if (e.key === "Enter" || e.key === "Tab") {
          e.preventDefault();
          applyAutocompleteSelection(acSelectedIndex);
          return;
        }
        if (e.key === "Escape") {
          e.preventDefault();
          hideAutocomplete();
          return;
        }
      }
    });

    // =========================================================
    // MODERATION, PRESENCE & MESSAGES
    // =========================================================
    function updateInputAccess() {
      if (!currentUser) return;
      const amIMuted = Boolean(mutedUsersMap[currentUser.uid]);

      if (!isAdmin && amIMuted) {
        messageForm.classList.add("hidden");
        emojiDrawer.classList.add("hidden");
        hideAutocomplete();
        restrictedBanner.textContent = "You have been muted by an admin.";
        restrictedBanner.classList.remove("hidden");
      } else if (!isAdmin && isRoomLocked) {
        messageForm.classList.add("hidden");
        emojiDrawer.classList.add("hidden");
        hideAutocomplete();
        restrictedBanner.textContent = "Chat is currently locked.";
        restrictedBanner.classList.remove("hidden");
      } else {
        restrictedBanner.classList.add("hidden");
        messageForm.classList.remove("hidden");
      }
    }

    function startModerationListeners() {
      const unsubMuted = onSnapshot(collection(db, "mutedUsers"), (snap) => {
        mutedUsersMap = {};
        snap.forEach((d) => {
          mutedUsersMap[d.id] = d.data();
        });
        mutedCountEl.textContent = Object.keys(mutedUsersMap).length;
        renderMutedModalList();
        updateInputAccess();
      });

      const unsubSettings = onSnapshot(doc(db, "settings", "general"), (docSnap) => {
        isRoomLocked = docSnap.exists() ? Boolean(docSnap.data().locked) : false;
        if (isRoomLocked) {
          lockBadge.classList.remove("hidden");
          toggleLockBtn.textContent = "Unlock";
        } else {
          lockBadge.classList.add("hidden");
          toggleLockBtn.textContent = "Lock";
        }
        updateInputAccess();
      });

      unsubscribers.push(unsubMuted, unsubSettings);
    }

    toggleLockBtn.addEventListener("click", async () => {
      if (!isAdmin) return;
      await setDoc(doc(db, "settings", "general"), { locked: !isRoomLocked }, { merge: true });
    });

    openMutedBtn.addEventListener("click", () => {
      mutedModal.classList.remove("hidden");
      mutedModal.classList.add("flex");
    });

    closeMutedModal.addEventListener("click", () => {
      mutedModal.classList.add("hidden");
      mutedModal.classList.remove("flex");
    });

    function renderMutedModalList() {
      const entries = Object.entries(mutedUsersMap);
      if (entries.length === 0) {
        mutedListEl.innerHTML = `<p class="text-xs text-zinc-500">No users are currently muted.</p>`;
        return;
      }
      mutedListEl.innerHTML = "";
      entries.forEach(([uid, info]) => {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between bg-zinc-900 px-3 py-2 rounded-xl border border-zinc-800";
        row.innerHTML = `
          <div class="truncate pr-2">
            <div class="text-xs font-semibold text-zinc-200 truncate">${escapeHTML(info.name || "Unknown")}</div>
            <div class="text-[11px] text-zinc-500 truncate">${escapeHTML(info.email || uid)}</div>
          </div>
        `;
        const unmuteBtn = document.createElement("button");
        unmuteBtn.textContent = "Unmute";
        unmuteBtn.className = "text-xs px-2.5 py-1 rounded-lg bg-yellow-600 hover:bg-yellow-500 text-black font-semibold cursor-pointer";
        unmuteBtn.onclick = () => deleteDoc(doc(db, "mutedUsers", uid));
        row.appendChild(unmuteBtn);
        mutedListEl.appendChild(row);
      });
    }

    function startPresence(uid) {
      const userRef = doc(db, "presence", uid);
      const ping = () =>
        setDoc(
          userRef,
          { name: getActiveDisplayName(), avatar: currentAvatarUrl, lastSeen: Date.now() },
          { merge: true }
        );
      ping();
      heartbeatInterval = setInterval(ping, 25000);

      const unsubPres = onSnapshot(collection(db, "presence"), (snap) => {
        const now = Date.now();
        Object.keys(knownUsers).forEach((k) => {
          knownUsers[k].online = false;
        });

        let activeCount = 0;
        snap.docs.forEach((d) => {
          const data = d.data();
          const isOnline = now - (data.lastSeen || 0) < 60000;
          if (isOnline) activeCount++;
          if (data.name) {
            knownUsers[d.id] = {
              name: data.name,
              avatar: data.avatar || knownUsers[d.id]?.avatar || "",
              online: isOnline
            };
          }
        });
        onlineCountEl.textContent = `${Math.max(1, activeCount)} online`;
      });
      unsubscribers.push(unsubPres);
    }

    function startChatListener() {
      const q = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(150));
      const unsubMsgs = onSnapshot(q, (snapshot) => {
        latestMessagesSnapshot = snapshot;
        renderAllMessages(snapshot);
      });
      unsubscribers.push(unsubMsgs);
    }

    function renderAllMessages(snapshot) {
      messagesContainer.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        if (data.uid && data.name && !knownUsers[data.uid]) {
          knownUsers[data.uid] = {
            name: data.name,
            avatar: data.avatar || "",
            online: false
          };
        }

        // Whisper visibility filter: only sender and recipient can view whispers
        if (data.isWhisper) {
          if (!currentUser) return;
          const myUid = currentUser.uid;
          const myNameLower = getActiveDisplayName().toLowerCase();
          const isSender = data.uid === myUid;
          const isRecipientByUid = data.whisperToUid && data.whisperToUid === myUid;
          const isRecipientByName =
            data.whisperToName && data.whisperToName.toLowerCase() === myNameLower;

          if (!isSender && !isRecipientByUid && !isRecipientByName) {
            return; // Hide whisper from everyone else
          }
        }

        renderMessage(docSnap.id, data);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Format @mentions by changing text color only (no background highlight):
    // - Self messages (yellow bubble): black text -> white (@mention)
    // - Others' messages (dark bubble): white text -> dark yellow (@mention)
    // - Whisper messages (purple bubble): light purple -> bright purple/white
    function formatMessageHTML(rawText, isMe, isWhisper = false) {
      const escaped = escapeHTML(rawText);
      const colorClass = isWhisper
        ? "text-purple-300 font-bold"
        : isMe
        ? "text-white font-bold"
        : "text-yellow-500 font-semibold";
      return escaped.replace(/(^|\s)(@[^\s@]+)/g, `$1<span class="${colorClass}">$2</span>`);
    }

    function renderMessage(id, msg) {
      const isMe = currentUser && msg.uid === currentUser.uid;
      const isWhisper = Boolean(msg.isWhisper);
      const isMsgFromAdmin = ADMIN_EMAILS.includes((msg.email || "").toLowerCase());
      const isUserMuted = Boolean(mutedUsersMap[msg.uid]);
      const myName = getActiveDisplayName().toLowerCase();
      const mentionsMe = !isMe && msg.text && msg.text.toLowerCase().includes(`@${myName}`);

      const wrapper = document.createElement("div");
      wrapper.className = `flex flex-col ${isMe ? "items-end" : "items-start"}`;

      const timeStr = msg.createdAt?.toDate
        ? msg.createdAt.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        : "Sending...";

      const meta = document.createElement("div");
      meta.className = "flex items-center gap-2 mb-1 px-1";

      // User Avatar next to Name
      const avatarSrc = msg.avatar || knownUsers[msg.uid]?.avatar || "";
      if (avatarSrc) {
        const avatarImg = document.createElement("img");
        avatarImg.src = avatarSrc;
        avatarImg.alt = msg.name;
        avatarImg.className = "w-5 h-5 rounded-full object-cover border border-zinc-700 shrink-0";
        meta.appendChild(avatarImg);
      } else {
        const avatarFallback = document.createElement("span");
        avatarFallback.textContent = (msg.name?.[0] || "?").toUpperCase();
        avatarFallback.className =
          "w-5 h-5 rounded-full bg-zinc-800 border border-zinc-700 text-[10px] font-bold text-yellow-500 flex items-center justify-center shrink-0";
        meta.appendChild(avatarFallback);
      }

      const nameBtn = document.createElement("button");
      nameBtn.type = "button";
      nameBtn.title = `Click to whisper or mention @${msg.name}`;
      nameBtn.textContent = msg.name;
      nameBtn.className = `text-xs font-semibold hover:underline cursor-pointer ${
        isWhisper ? "text-purple-400" : isMe ? "text-yellow-500" : "text-zinc-300"
      }`;
      nameBtn.onclick = () => {
        insertAtCursor(`@${msg.name} `);
      };

      const timeSpan = document.createElement("span");
      timeSpan.className = "text-[11px] text-zinc-500";
      timeSpan.textContent = timeStr;

      meta.appendChild(nameBtn);
      meta.appendChild(timeSpan);

      if (isAdmin && !isMe && !isMsgFromAdmin) {
        const muteBtn = document.createElement("button");
        muteBtn.textContent = isUserMuted ? "Unmute" : "Mute";
        muteBtn.className = `text-[11px] transition cursor-pointer ${
          isUserMuted ? "text-yellow-500 hover:text-yellow-400 font-semibold" : "text-zinc-500 hover:text-yellow-500"
        }`;
        muteBtn.onclick = async () => {
          if (mutedUsersMap[msg.uid]) {
            await deleteDoc(doc(db, "mutedUsers", msg.uid));
          } else {
            await setDoc(doc(db, "mutedUsers", msg.uid), {
              name: msg.name,
              email: msg.email || "",
              mutedAt: serverTimestamp()
            });
          }
        };
        meta.appendChild(muteBtn);
      }

      if (isMe || isAdmin) {
        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "text-[11px] text-zinc-600 hover:text-red-400 transition cursor-pointer";
        delBtn.onclick = () => deleteDoc(doc(db, "messages", id));
        meta.appendChild(delBtn);
      }

      // Bubble Styling: Purple for Whispers, Yellow for Self, Dark for Others
      const bubble = document.createElement("div");
      if (isWhisper) {
        bubble.className =
          "max-w-[80%] sm:max-w-[70%] rounded-xl px-4 py-2.5 text-sm break-words bg-purple-950/90 text-purple-100 border border-purple-500/70 shadow-[0_0_15px_rgba(168,85,247,0.18)]";
      } else if (isMe) {
        bubble.className =
          "max-w-[80%] sm:max-w-[70%] rounded-xl px-4 py-2.5 text-sm break-words bg-yellow-600 text-black font-medium";
      } else if (mentionsMe) {
        bubble.className =
          "max-w-[80%] sm:max-w-[70%] rounded-xl px-4 py-2.5 text-sm break-words bg-zinc-900 text-zinc-100 border border-yellow-500/70 shadow-[0_0_12px_rgba(234,179,8,0.12)]";
      } else {
        bubble.className =
          "max-w-[80%] sm:max-w-[70%] rounded-xl px-4 py-2.5 text-sm break-words bg-zinc-900 text-zinc-100 border border-zinc-800";
      }

      // Whisper Header Tag inside the Purple Bubble
      if (isWhisper) {
        const whisperTag = document.createElement("div");
        whisperTag.className = "text-[11px] font-semibold text-purple-300 mb-1 flex items-center gap-1";
        whisperTag.textContent = isMe
          ? `🔒 Whispered to @${msg.whisperToName}`
          : `🔒 Whisper from @${msg.name}`;
        bubble.appendChild(whisperTag);
      }

      if (msg.image) {
        const img = document.createElement("img");
        img.src = msg.image;
        img.className = "max-h-64 rounded-lg mb-1.5 cursor-zoom-in border border-black/20";
        img.onclick = () => {
          lightboxImg.src = msg.image;
          lightbox.classList.remove("hidden");
          lightbox.classList.add("flex");
        };
        bubble.appendChild(img);
      }

      if (msg.text) {
        const p = document.createElement("p");
        p.className = "whitespace-pre-wrap";
        p.innerHTML = formatMessageHTML(msg.text, isMe, isWhisper);
        bubble.appendChild(p);
      }

      wrapper.appendChild(meta);
      wrapper.appendChild(bubble);
      messagesContainer.appendChild(wrapper);
    }

    // Parse "/msg @target [message]" (supports multi-word known user names too)
    function parseWhisperCommand(rawText) {
      if (!rawText.toLowerCase().startsWith("/msg ")) return null;
      const rest = rawText.slice(5).trim();
      if (!rest.startsWith("@")) {
        return { error: "Usage: /msg @username your secret message" };
      }

      const afterAt = rest.slice(1);
      // Sort known users longest-name-first so multi-word names match accurately
      const candidates = Object.entries(knownUsers)
        .filter(([, u]) => u.name)
        .sort((a, b) => b[1].name.length - a[1].name.length);

      for (const [uid, u] of candidates) {
        const lowerName = u.name.toLowerCase();
        if (
          afterAt.toLowerCase().startsWith(lowerName + " ") ||
          afterAt.toLowerCase() === lowerName
        ) {
          const whisperBody = afterAt.slice(u.name.length).trim();
          return {
            targetUid: uid,
            targetName: u.name,
            whisperText: whisperBody
          };
        }
      }

      // Fallback: single-word @username if not in recent cache
      const spaceIdx = afterAt.indexOf(" ");
      if (spaceIdx === -1) {
        return {
          targetUid: null,
          targetName: afterAt,
          whisperText: ""
        };
      }
      return {
        targetUid: null,
        targetName: afterAt.slice(0, spaceIdx),
        whisperText: afterAt.slice(spaceIdx + 1).trim()
      };
    }

    messageForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;
      if (!isAdmin && (mutedUsersMap[currentUser.uid] || isRoomLocked)) return;

      const rawText = messageInput.value.trim();
      if (!rawText && !pendingImageBase64) return;

      // Check for "/msg @user text" whisper command
      const whisper = parseWhisperCommand(rawText);
      if (whisper) {
        if (whisper.error) {
          showCommandNotice(whisper.error);
          return;
        }
        if (!whisper.whisperText && !pendingImageBase64) {
          showCommandNotice(`Type a message after @${whisper.targetName} to send a whisper.`);
          return;
        }

        const payload = {
          uid: currentUser.uid,
          email: currentUser.email || "",
          name: getActiveDisplayName(),
          avatar: currentAvatarUrl || null,
          text: whisper.whisperText,
          image: pendingImageBase64 || null,
          isWhisper: true,
          whisperToUid: whisper.targetUid || null,
          whisperToName: whisper.targetName,
          createdAt: serverTimestamp()
        };

        messageInput.value = "";
        emojiDrawer.classList.add("hidden");
        hideAutocomplete();
        clearPendingImage();
        await addDoc(collection(db, "messages"), payload);
        return;
      }

      // Standard public message
      const payload = {
        uid: currentUser.uid,
        email: currentUser.email || "",
        name: getActiveDisplayName(),
        avatar: currentAvatarUrl || null,
        text: rawText,
        image: pendingImageBase64 || null,
        createdAt: serverTimestamp()
      };

      messageInput.value = "";
      emojiDrawer.classList.add("hidden");
      hideAutocomplete();
      clearPendingImage();
      await addDoc(collection(db, "messages"), payload);
    });

    function processImageFile(file) {
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 900;
          const scale = Math.min(1, MAX_WIDTH / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          pendingImageBase64 = canvas.toDataURL("image/jpeg", 0.75);
          imagePreviewThumb.src = pendingImageBase64;
          imagePreviewBar.classList.remove("hidden");
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearPendingImage() {
      pendingImageBase64 = null;
      imageInput.value = "";
      imagePreviewThumb.src = "";
      imagePreviewBar.classList.add("hidden");
    }

    uploadBtn.addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", (e) => processImageFile(e.target.files[0]));
    cancelImageBtn.addEventListener("click", clearPendingImage);

    window.addEventListener("paste", (e) => {
      const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
      if (item) processImageFile(item.getAsFile());
    });

    window.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (currentUser) {
        dropOverlay.classList.remove("hidden");
        dropOverlay.classList.add("flex");
      }
    });

    window.addEventListener("dragleave", (e) => {
      if (e.relatedTarget === null) {
        dropOverlay.classList.add("hidden");
        dropOverlay.classList.remove("flex");
      }
    });

    window.addEventListener("drop", (e) => {
      e.preventDefault();
      dropOverlay.classList.add("hidden");
      dropOverlay.classList.remove("flex");
      if (currentUser && e.dataTransfer.files[0]) processImageFile(e.dataTransfer.files[0]);
    });

    lightbox.addEventListener("click", () => {
      lightbox.classList.add("hidden");
      lightbox.classList.remove("flex");
    });

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
  </script>
</body>
</html>
